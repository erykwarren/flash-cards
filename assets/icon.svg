<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00d4ff"/>
      <stop offset="100%" style="stop-color:#00ff9d"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  
  <!-- Card stack effect -->
  <rect x="140" y="140" width="240" height="160" rx="16" fill="#2a2a4a" transform="rotate(-6 260 220)"/>
  <rect x="140" y="140" width="240" height="160" rx="16" fill="#3a3a5a" transform="rotate(-3 260 220)"/>
  
  <!-- Main card -->
  <rect x="136" y="176" width="240" height="160" rx="16" fill="url(#accent)"/>
  
  <!-- Question mark -->
  <text x="256" y="280" font-family="Outfit, sans-serif" font-size="80" font-weight="bold" fill="#1a1a2e" text-anchor="middle">?</text>
  
  <!-- Flip indicator -->
  <path d="M320 380 L350 380 L335 400 Z" fill="#00d4ff" opacity="0.8"/>
  <path d="M320 380 L290 380 L305 360 Z" fill="#00ff9d" opacity="0.8"/>
</svg>

